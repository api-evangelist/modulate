aid: modulate
name: Modulate
description: 'Modulate is a voice AI company based in Cambridge, Massachusetts, building
  audio-native voice intelligence for trust, safety, and conversation understanding.
  Its Velma-2 platform exposes a suite of REST (batch) and WebSocket (streaming) model
  APIs — multilingual and English speech-to-text transcription with speaker diarization,
  deepfake (synthetic voice) detection, emotion and accent detection, PII/PHI tagging
  and redaction, language detection, and music/speech and AI-music detection — alongside
  Velma conversation analysis (behaviors, topics, sentiment, participant roles) and
  the ToxMod voice-safety product for gaming and social platforms. Authentication is
  via an X-API-Key header (an api_key query parameter for WebSocket streams), billed
  per hour of audio processed. Backed by Sierra Ventures.'
